# 《纸上人生》· 选题库
#
# 主力赛道：生活技巧（15 篇）
# 副线赛道：人生道理（5 篇）
#
# 页面字段：
#   top / bottom        字幕（*关键词* 标成朱红）
#   top_actor / bottom_actor
#     pose    stand/walk/run/sit/lie/sleep/desk/armsup/headache/wave
#     mood    neutral/happy/joy/sad/rage/tired/cold/calm/think/smug/cry
#     hair    short/bun/middle/curly/bald/pony/long
#     shirt   衣服色 (R,G,B)
#     prop    phone/book/laptop/clock
#     bubble  气泡文字
#     bubble_kind  speech/think/shout/aside
#     bubble_tail  down/left/right
#     sfx      拟声词（漫画效果字）
#   top_scene / bottom_scene
#
# 文案铁律（最重要）：
#   1. 上句和下句之间必须有转折连词："但是 / 可是 / 而 / 其实 / 结果"
#   2. 一眼能懂，不用术语、不用书面语
#   3. 上下句字数接近，读起来是一组对比
#   4. 写具体的动作和数字，不写"高效""优化"这种空话
#   5. *关键词* 一页只标一个
#   6. 上句写"错误的做法"，下句写"正确的做法"

# ══════════════════════════════════════════════════════
#  生活技巧（主力赛道）
# ══════════════════════════════════════════════════════

